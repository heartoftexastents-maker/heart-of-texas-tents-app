<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Heart of Texas Quote">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Heart of Texas Quote</title>
<style>
:root{--navy:#101f46;--red:#b8202a;--light:#f4f6f8;--gray:#64748b;--border:#d9e0e8;--white:#fff;--green:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:620px;margin:auto;padding:12px 12px 42px}.header{background:#fff;border-radius:18px;padding:12px 14px 14px;text-align:center;box-shadow:0 4px 16px #00000012;border-top:7px solid var(--navy)}
.logo{width:135px;height:105px;object-fit:contain;display:block;margin:0 auto 2px}.header h1{font-family:Georgia,serif;font-size:20px;letter-spacing:1.2px;margin:0;color:var(--navy)}.header p{font-size:10px;margin:5px 0 0;color:var(--gray);font-weight:700;letter-spacing:.5px}
.card{background:#fff;border-radius:16px;padding:15px;margin-top:12px;box-shadow:0 3px 12px #0000000d}.title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--red);border-bottom:2px solid var(--red);padding-bottom:6px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.optional{font-weight:500;color:var(--gray)}
input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:15px;background:#fff;color:var(--navy)}textarea{min-height:70px;resize:vertical}
.item{display:grid;grid-template-columns:1fr 68px 82px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f4}.iname{font-weight:750;font-size:13px}.price{font-size:11px;color:var(--gray);margin-top:2px}.qty{padding:8px;text-align:center;font-weight:900}.line{text-align:right;font-weight:800;font-size:13px}.totals{background:var(--navy);color:#fff;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.grand{border-top:1px solid #ffffff55;margin-top:7px;padding-top:10px;font-size:21px;font-weight:900}.balance{font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:11px;padding:13px 9px;font-weight:850;font-size:14px;cursor:pointer}.primary{background:var(--red);color:#fff}.navy{background:var(--navy);color:#fff}.light{background:#e8edf2;color:var(--navy)}.green{background:var(--green);color:#fff}
.preview{font-size:13px;line-height:1.5;white-space:pre-wrap;background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:12px}.hint{font-size:11px;color:var(--gray);line-height:1.4;margin-top:9px}
.manageRow{display:grid;grid-template-columns:1fr 80px 70px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f4}.manageRow input{padding:8px;font-size:13px}.smallBtn{border:0;border-radius:8px;padding:8px;font-weight:800;cursor:pointer}.settings{font-size:12px;color:var(--gray)}

.addressWrap{position:relative}.addressSuggestions{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 22px #0002;overflow:hidden;margin-top:4px}.addressSuggestion{display:block;width:100%;border:0;background:#fff;color:var(--navy);text-align:left;padding:11px 12px;font-size:13px;line-height:1.25}.addressSuggestion + .addressSuggestion{border-top:1px solid #eef1f4}.addressSuggestion:active{background:#eef3f8}.addressHint{padding:10px 12px;color:var(--gray);font-size:12px}
.calendarToolbar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:10px}.calendarToolbar button{border:0;border-radius:10px;background:#e8edf2;color:var(--navy);font-weight:900;font-size:18px;padding:9px}.calendarMonth{text-align:center;font-weight:900;font-size:16px}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendarDow{text-align:center;font-size:9px;font-weight:900;color:var(--gray);padding:4px 0}.calendarCell{min-height:52px;border:1px solid #e5e7eb;border-radius:9px;background:#fff;padding:5px;text-align:left;position:relative;color:var(--navy)}.calendarCell.empty{border-color:transparent;background:transparent}.calendarCell.today{border-color:#b8202a}.calendarCell.hasBooking{background:#eef4ff;border-color:#b8c8e8}.calendarNum{font-size:11px;font-weight:900}.calendarDot{display:inline-flex;min-width:17px;height:17px;border-radius:999px;background:#16834a;color:#fff;align-items:center;justify-content:center;font-size:9px;font-weight:900;margin-top:4px}.calendarDetails{margin-top:12px;border:1px solid var(--border);border-radius:12px;padding:11px;background:#f8fafc}.calendarDetailJob{background:#fff;border-radius:9px;padding:9px;margin-top:8px;border:1px solid #e5e7eb}.calendarDetailJob b{font-size:12px}.calendarDetailMeta{font-size:11px;color:#475569;line-height:1.5;margin-top:4px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 58px 72px}.btns{grid-template-columns:1fr}}
@media print{body{background:#fff}.app{max-width:800px}.btns,.hint,.settings,.manageRow,.add,#adminPanel{display:none!important}.card,.header{box-shadow:none}.header{border:1px solid #ddd}}

/* Customer PDF / print sheet */
.pdfQuote{display:none}
@media print{
 @page{size:Letter;margin:.35in}
 html,body{background:#fff!important}
 body.printing .app{display:block!important;max-width:none!important;padding:0!important;margin:0!important;background:#fff!important}
 body.printing .app > *:not(#pdfQuote){display:none!important}
 body.printing #pdfQuote{display:block!important;width:100%!important;max-width:7.8in!important;margin:0 auto!important;font-family:Arial,Helvetica,sans-serif;color:#17264d;font-size:10pt;line-height:1.3;background:#fff!important}
 .pdfSheet{border:1px solid #d9e0e8;border-radius:10px;overflow:hidden;background:#fff}
 .pdfTop{height:8px;background:#17264d}
 .pdfHead{display:flex;align-items:center;padding:15px 17px 12px;border-bottom:1px solid #d9e0e8}
 .pdfLogo{width:82px;height:68px;object-fit:contain;margin-right:13px}
 .pdfBrand{flex:1;min-width:0}.pdfBrand h1{margin:0;font-family:Georgia,serif;font-size:19px;letter-spacing:1px;color:#17264d;line-height:1.1}
 .pdfBrand p{margin:4px 0 0;font-size:8pt;color:#66758c;font-weight:800;letter-spacing:.45px}
 .pdfContact{margin-left:12px;text-align:right;font-size:7.8pt;line-height:1.45;color:#44546c;white-space:nowrap}
 .pdfTitleBar{display:flex;justify-content:space-between;align-items:center;padding:10px 17px;background:#f4f6f8;border-bottom:1px solid #d9e0e8}
 .pdfTitleBar h2{margin:0;color:#b8202a;font-size:16px;letter-spacing:1.1px}.pdfMeta{text-align:right;font-size:8.2pt;line-height:1.5;color:#44546c}.pdfMeta b{color:#17264d}
 .pdfInfo{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:11px 17px 4px}.pdfBox{border:1px solid #d9e0e8;border-radius:6px;padding:7px 9px;min-height:30px}.pdfBoxWide{grid-column:1/-1}
 .pdfLabel{font-size:7pt;text-transform:uppercase;font-weight:900;color:#66758c;letter-spacing:.45px}.pdfValue{font-size:9.4pt;font-weight:700;color:#17264d;margin-top:2px;word-break:break-word}
 .pdfItemsWrap{padding:6px 17px 0}.pdfTable{width:100%;border-collapse:collapse}.pdfTable th{background:#17264d;color:#fff;text-align:left;padding:6px 7px;font-size:8pt;text-transform:uppercase;letter-spacing:.3px}.pdfTable th:nth-child(1),.pdfTable td:nth-child(1){width:9%;text-align:center}.pdfTable th:nth-child(3),.pdfTable td:nth-child(3),.pdfTable th:nth-child(4),.pdfTable td:nth-child(4){text-align:right}.pdfTable td{padding:6px 7px;border-bottom:1px solid #e3e7ec;font-size:9pt}.pdfTable tbody tr:last-child td{border-bottom:1px solid #cbd5e1}
 .pdfTotalsArea{display:flex;justify-content:flex-end;padding:8px 17px 0}.pdfTotals{width:44%;min-width:230px}.pdfTotalRow{display:flex;justify-content:space-between;gap:15px;padding:3px 0;font-size:9pt}.pdfGrand{border-top:2px solid #b8202a;margin-top:4px;padding:7px 0 5px;font-size:13.5pt;font-weight:900}.pdfBalance{font-weight:900;color:#b8202a;border-top:1px solid #d9e0e8;margin-top:2px;padding-top:5px}
 .pdfNotes{margin:9px 17px 0;border:1px solid #d9e0e8;border-left:4px solid #b8202a;border-radius:6px;padding:7px 9px}.pdfFooter{margin-top:12px;padding:9px 17px 12px;background:#17264d;color:#fff;text-align:center;font-size:7.8pt;line-height:1.45}.pdfFooter b{color:#fff}
}
</style>
</head>

<div class="header">
